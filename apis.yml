aid: favorited
name: favorited
description: >-
  Favorited is a mobile-first live streaming platform that helps content
  creators run interactive, real-time shows with their audiences. The app
  centers on participatory formats — games, giveaways, and community
  interactions — so that viewers feel like they are playing together with a
  creator rather than passively watching a broadcast, alongside monetization
  tools for creators. Favorited ships as consumer iOS and Android apps and, as
  of this profile, publishes no public developer API, SDK, or documentation
  surface. It was surfaced as a portfolio company of a16z and added to the API
  Evangelist network for enrichment and monitoring.
